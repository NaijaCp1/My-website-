<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game & Social Top-Up Store</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #151821;
      --card-border: #232736;
      --accent-color: #e52b71;
      --accent-hover: #ff3a83;
      --text-main: #ffffff;
      --text-sub: #9ea3b5;
      --input-bg: #1d212f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 12px;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    /* Category Filter Navigation */
    .filter-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .filter-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(229, 43, 113, 0.4);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--accent-color);
    }

    /* Game Selection Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .game-card:hover, .game-card.selected {
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(229, 43, 113, 0.15);
    }

    .game-icon {
      width: 48px;
      height: 48px;
      background: #202433;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .game-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .game-info span {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* Top-Up Section */
    .store-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      display: none;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Step Inputs */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    /* Packages Grid */
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .package-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .package-card:hover, .package-card.active {
      border-color: var(--accent-color);
      background: #232738;
    }

    .package-card.active {
      box-shadow: 0 0 10px rgba(229, 43, 113, 0.25);
    }

    .package-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .package-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Checkout Bar */
    .checkout-btn {
      width: 100%;
      background: var(--accent-color);
      border: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s ease;
    }

    .checkout-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .order-summary {
      background: var(--input-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      margin-bottom: 8px;
    }

    .summary-row:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px dashed var(--card-border);
      font-weight: 700;
      font-size: 1rem;
    }

    .whatsapp-btn {
      width: 100%;
      background: #25d366;
      border: none;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .whatsapp-btn:hover {
      background: #20bd5a;
    }
  </style>
</head>
<body>

  <header>
    <h1>Instant Top-Up Store</h1>
    <p>Select your game or app to instantly purchase credits</p>
  </header>

  <!-- Category Filter Buttons -->
  <div class="filter-container">
    <button class="filter-btn active" onclick="filterCategory('All', this)">All Games</button>
    <button class="filter-btn" onclick="filterCategory('Call of Duty (CODM)', this)">Call of Duty (CODM)</button>
    <button class="filter-btn" onclick="filterCategory('eFootball PES', this)">eFootball PES</button>
    <button class="filter-btn" onclick="filterCategory('Free Fire', this)">Free Fire</button>
    <button class="filter-btn" onclick="filterCategory('Blood Strike', this)">Blood Strike</button>
    <button class="filter-btn" onclick="filterCategory('TikTok Coins', this)">TikTok Coins</button>
    <button class="filter-btn" onclick="filterCategory('Dream League (DLS)', this)">Dream League (DLS)</button>
    <button class="filter-btn" onclick="filterCategory('OneState RP', this)">OneState RP</button>
  </div>

  <!-- Game Category Grid -->
  <div class="games-grid" id="gamesGrid"></div>

  <!-- Package Selection Section -->
  <div class="store-section" id="packageSection">
    <div class="section-title">
      <span id="selectedGameIcon"></span>
      <span id="selectedGameName"></span> Packages
    </div>

    <div class="input-group">
      <label id="userIdLabel" for="playerUserId">Player User ID / Account Tag</label>
      <input type="text" id="playerUserId" placeholder="Enter your ID here..." />
    </div>

    <div class="packages-grid" id="packagesGrid"></div>

    <button class="checkout-btn" onclick="openCheckoutModal()">Proceed to Checkout</button>
  </div>

  <!-- Modal / Checkout View -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Confirm Order</h3>
        <button class="modal-close" onclick="closeCheckoutModal()">&times;</button>
      </div>

      <div class="order-summary">
        <div class="summary-row">
          <span>Game:</span>
          <span id="modalGame">--</span>
        </div>
        <div class="summary-row">
          <span>Account ID:</span>
          <span id="modalId">--</span>
        </div>
        <div class="summary-row">
          <span>Package:</span>
          <span id="modalPackage">--</span>
        </div>
        <div class="summary-row">
          <span>Total Price:</span>
          <span id="modalPrice">₦0.00</span>
        </div>
      </div>

      <button class="whatsapp-btn" onclick="completeOrderViaWhatsApp()">
        <span>Complete Order via WhatsApp</span>
      </button>
    </div>
  </div>

  <script>
    // Database containing all 7 games and their updated prices
    const storeData = [
      {
        id: "freefire",
        name: "Free Fire",
        category: "Free Fire",
        icon: "🔥",
        idLabel: "Free Fire Player ID",
        packages: [
          { name: "Weekly Membership", price: "₦3,135" },
          { name: "Monthly Membership", price: "₦14,633" },
          { name: "Booyah Pass (Elite Pass)", price: "₦3,750" },
          { name: "Booyah Pass Premium Bundle", price: "₦7,500" },
          { name: "100 Diamonds", price: "₦1,575.08" },
          { name: "100 + 10 Diamonds", price: "₦1,580.64" },
          { name: "210 Diamonds", price: "₦3,150.15" },
          { name: "210 + 21 Diamonds", price: "₦3,161.28" },
          { name: "310 Diamonds", price: "₦4,725.23" },
          { name: "520 Diamonds", price: "₦7,875.39" },
          { name: "530 + 53 Diamonds", price: "₦7,942.48" },
          { name: "1,060 Diamonds", price: "₦15,750.77" },
          { name: "1,080 + 108 Diamonds", price: "₦15,884.95" },
          { name: "2,180 Diamonds", price: "₦31,501.54" },
          { name: "2,200 + 220 Diamonds", price: "₦31,612.79" }
        ]
      },
      {
        id: "tiktok",
        name: "TikTok Coins",
        category: "TikTok Coins",
        icon: "🎵",
        idLabel: "TikTok Username (@username)",
        packages: [
          { name: "350 TikTok Coins", price: "₦8,500.00" },
          { name: "700 TikTok Coins", price: "₦17,500.00" },
          { name: "1,500 TikTok Coins", price: "₦35,000.00" },
          { name: "3,500 TikTok Coins", price: "₦72,500.00" },
          { name: "7,000 TikTok Coins", price: "₦151,500.00" },
          { name: "17,500 TikTok Coins", price: "₦340,000.00" }
        ]
      },
      {
        id: "codm",
        name: "Call of Duty (CODM)",
        category: "Call of Duty (CODM)",
        icon: "🔫",
        idLabel: "CODM OpenID / Player ID",
        packages: [
          { name: "80 CP", price: "₦1,650" },
          { name: "420 CP", price: "₦7,425" },
          { name: "880 CP", price: "₦14,850" },
          { name: "2,400 CP", price: "₦37,125" },
          { name: "5,000 CP", price: "₦74,250" },
          { name: "Battle Pass (Direct)", price: "₦7,400" }
        ]
      },
      {
        id: "efootball",
        name: "eFootball PES",
        category: "eFootball PES",
        icon: "⚽",
        idLabel: "Konami ID / User ID",
        packages: [
          { name: "100 eFootball Coins", price: "₦1,600" },
          { name: "300 eFootball Coins", price: "₦4,400" },
          { name: "550 eFootball Coins", price: "₦9,500" },
          { name: "1,040 eFootball Coins", price: "₦14,000" },
          { name: "2,130 eFootball Coins", price: "₦28,500" },
          { name: "3,250 eFootball Coins", price: "₦41,000" }
        ]
      },
      {
        id: "bloodstrike",
        name: "Blood Strike",
        category: "Blood Strike",
        icon: "🩸",
        idLabel: "Blood Strike User ID",
        packages: [
          { name: "100 + 5 Gold", price: "₦1,374" },
          { name: "300 + 20 Gold", price: "₦4,148" },
          { name: "500 + 40 Gold", price: "₦6,922" },
          { name: "1,000 + 100 Gold", price: "₦13,857" },
          { name: "Strike Pass Elite", price: "₦4,607" },
          { name: "Strike Pass Premium", price: "₦12,247" }
        ]
      },
      {
        id: "onestate",
        name: "OneState RP",
        category: "OneState RP",
        icon: "🏙️",
        idLabel: "OneState Player ID",
        packages: [
          { name: "100 State Coins", price: "₦3,800" },
          { name: "300 State Coins", price: "₦8,000" },
          { name: "500 State Coins", price: "₦16,000" }
        ]
      },
      {
        id: "dls",
        name: "Dream League (DLS)",
        category: "Dream League (DLS)",
        icon: "🏟️",
        idLabel: "DLS Manager ID",
        packages: [
          { name: "Small Coin Pack", price: "₦3,500" },
          { name: "Medium Coin Pack", price: "₦8,000" },
          { name: "Season Pass / Premium", price: "₦4,500" }
        ]
      }
    ];

    let currentGame = null;
    let currentPackage = null;
    const YOUR_WHATSAPP_NUMBER = "2340000000000"; // Replace with your actual WhatsApp number

    // Render Games Grid
    function renderGames(filterCategory = 'All') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      storeData.forEach(game => {
        if (filterCategory === 'All' || game.category === filterCategory) {
          const card = document.createElement('div');
          card.className = `game-card ${currentGame && currentGame.id === game.id ? 'selected' : ''}`;
          card.onclick = () => selectGame(game.id);
          card.innerHTML = `
            <div class="game-icon">${game.icon}</div>
            <div class="game-info">
              <h3>${game.name}</h3>
              <span>Instant Top-Up</span>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }

    // Filter Buttons Logic
    window.filterCategory = function(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderGames(category);
      
      // Hide package section if filtering hides the currently selected game
      if (currentGame && category !== 'All' && currentGame.category !== category) {
        document.getElementById('packageSection').style.display = 'none';
        currentGame = null;
        currentPackage = null;
      }
    };

    // Select Game and show packages
    window.selectGame = function(gameId) {
      currentGame = storeData.find(g => g.id === gameId);
      currentPackage = null;
      
      renderGames(document.querySelector('.filter-btn.active').innerText); // Re-render to highlight selection

      const section = document.getElementById('packageSection');
      section.style.display = 'block';
      document.getElementById('selectedGameIcon').innerText = currentGame.icon;
      document.getElementById('selectedGameName').innerText = currentGame.name;
      document.getElementById('userIdLabel').innerText = currentGame.idLabel;
      document.getElementById('playerUserId').value = '';

      // Render Packages
      const pkgGrid = document.getElementById('packagesGrid');
      pkgGrid.innerHTML = '';
      
      currentGame.packages.forEach((pkg, index) => {
        const pCard = document.createElement('div');
        pCard.className = 'package-card';
        pCard.onclick = () => selectPackage(index, pCard);
        pCard.innerHTML = `
          <div class="package-name">${pkg.name}</div>
          <div class="package-price">${pkg.price}</div>
        `;
        pkgGrid.appendChild(pCard);
      });

      // Scroll to package section
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    // Select a package
    window.selectPackage = function(index, element) {
      document.querySelectorAll('.package-card').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentPackage = currentGame.packages[index];
    };

    // Checkout Modal Logic
    window.openCheckoutModal = function() {
      const userId = document.getElementById('playerUserId').value.trim();

      if (!currentPackage) {
        alert("Please select a top-up package first.");
        return;
      }
      if (!userId) {
        alert("Please enter your Player ID or Username.");
        return;
      }

      document.getElementById('modalGame').innerText = currentGame.name;
      document.getElementById('modalId').innerText = userId;
      document.getElementById('modalPackage').innerText = currentPackage.name;
      document.getElementById('modalPrice').innerText = currentPackage.price;

      document.getElementById('checkoutModal').classList.add('active');
    };

    window.closeCheckoutModal = function() {
      document.getElementById('checkoutModal').classList.remove('active');
    };

    // Complete via WhatsApp
    window.completeOrderViaWhatsApp = function() {
      const userId = document.getElementById('playerUserId').value.trim();
      const text = `Hello! I want to buy a top-up.\n\n*Game:* ${currentGame.name}\n*ID:* ${userId}\n*Package:* ${currentPackage.name}\n*Price:* ${currentPackage.price}\n\nPlease send payment details.`;
      
      const whatsappUrl = `https://wa.me/${YOUR_WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
      window.open(whatsappUrl, '_blank');
      closeCheckoutModal();
    };

    // Initial Render
    renderGames();
  </script>
</body>
</html>
